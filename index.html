<!-- left sidebar on a PC (a top bar on a phone), like the quotation software -->

<script src="rules.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="photos.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.M2P_DEV) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { reg.update(); }).catch(function () {});
    // a new version took over: reload once so the new screens show straight away
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
  }
</script>
</body>
