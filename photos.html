<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site photos - TITANS WINDOWS</title>
<link rel="icon" href="assets/m2p-favicon.png">
<meta name="theme-color" content="#131B4E">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #131B4E; --navy-900: #0A1030; --gold: #D4AF37; --gold-300: #EFD87E; --ink: #101744; --muted: #79819C; --bg: #F3F4F9; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: linear-gradient(135deg, #0A1030, #131B4E 60%, #243085); color: #C6CDE0; padding: 18px 16px 20px; padding-top: max(18px, env(safe-area-inset-top)); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; box-shadow: 0 0 0 1px rgba(212,175,55,.5); }
  .brand b { font: 700 14px "Cinzel", "Times New Roman", serif; color: #fff; letter-spacing: .06em; }
  .brand span { display: block; font-size: 10px; color: var(--gold-300); letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin: 0; font: 700 26px "Space Grotesk", sans-serif; color: #fff; }
  .meta { margin-top: 4px; font-size: 14px; }
  .meta b { color: var(--gold-300); }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .grid a { display: block; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 6px 20px -12px rgba(16,23,68,.35); }
  .grid img { display: block; width: 100%; height: 240px; object-fit: cover; }
  .grid a.broken { display: grid; place-items: center; height: 240px; color: var(--muted); font-size: 13px; padding: 16px; text-align: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .box { position: fixed; inset: 0; background: rgba(4,8,26,.94); display: grid; place-items: center; padding: 12px; z-index: 9; }
  .box img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .box[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="assets/titans_logo_trim.png" alt=""><div><b>TITANS WINDOWS</b><span>Site photos</span></div></div>
  <h1 id="title">Site photos</h1>
  <div class="meta" id="meta"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<div class="box" id="box" hidden><img id="big" alt=""></div>
<script src="config.js"></script>
<script>
  (function () {
    var C = window.CONFIG;
    var q = new URLSearchParams(location.hash.slice(1));
    var key = q.get('k') || '', item = q.get('i') || '', ids = (q.get('p') || '').split(',').filter(Boolean);
    var safe = function (s) { return /^[a-z0-9]+$/i.test(s); };
    var text = function (id, t) { document.getElementById(id).textContent = t; };
    text('title', (q.get('c') || 'Window') + (q.get('l') ? ' · ' + q.get('l') : ''));
    var meta = document.getElementById('meta');
    meta.innerHTML = '';
    [['Job', q.get('n')], ['Size', q.get('s') ? q.get('s') + ' mm' : '']].forEach(function (x) {
      if (!x[1]) return;
      var s = document.createElement('span'); s.textContent = x[0] + ' '; var b = document.createElement('b'); b.textContent = x[1];
      s.appendChild(b); meta.appendChild(s); meta.appendChild(document.createTextNode('   '));
    });
    var grid = document.getElementById('grid');
    if (!safe(key) || !safe(item) || !ids.length || !ids.every(safe)) {
      grid.outerHTML = '<p class="empty">This link has no photos.</p>';
      return;
    }
    var base = String(C.supabaseUrl).replace(/\/$/, '') + '/storage/v1/object/public/' + C.photoBucket + '/';
    ids.forEach(function (id, n) {
      var a = document.createElement('a');
      var src = base + key + '/' + item + '/' + id + '.jpg';
      a.href = src;
      var img = document.createElement('img');
      img.src = src; img.alt = 'Site photo ' + (n + 1); img.loading = 'lazy';
      img.onerror = function () { a.className = 'broken'; a.textContent = 'Photo ' + (n + 1) + ' could not be loaded'; };
      a.appendChild(img);
      a.addEventListener('click', function (e) {
        if (a.className === 'broken') return;
        e.preventDefault(); document.getElementById('big').src = src; document.getElementById('box').hidden = false;
      });
      grid.appendChild(a);
    });
    document.getElementById('box').addEventListener('click', function () { this.hidden = true; });
  })();
</script>
</body>
</html>
