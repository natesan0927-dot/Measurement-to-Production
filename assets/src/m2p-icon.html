<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .i { width: 512px; height: 512px; position: relative; overflow: hidden;
       background: radial-gradient(420px 320px at 75% 10%, rgba(212,175,55,.28), transparent 70%), linear-gradient(145deg, #0A1030 0%, #131B4E 55%, #243085 100%); }
  .i.round { border-radius: 112px; }
  .frame { position: absolute; inset: var(--inset); border: 6px solid transparent; border-radius: 34px;
           background: linear-gradient(135deg, #6E5210, #F3E39C 30%, #D4AF37 50%, #8E6C13 70%, #EFD87E) border-box;
           -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .9; }
  .txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .m2p { font: 900 var(--fs) "Cinzel", serif; letter-spacing: .02em; line-height: 1;
         background: linear-gradient(180deg, #FFF4C2 0%, #EFD87E 35%, #D4AF37 60%, #A87F1A 100%); -webkit-background-clip: text; color: transparent;
         filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  .sub { margin-top: var(--gap); font: 700 var(--sfs) "Cinzel", serif; letter-spacing: .32em; color: #EFD87E; opacity: .9; padding-left: .32em; }
</style></head><body>
<div class="i" id="icon"><div class="frame"></div><div class="txt"><div class="m2p">M2P</div><div class="sub">TITANS</div></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const mask = q.get('mask') === '1';
  const el = document.getElementById('icon');
  // maskable icons keep everything inside the middle 80% (phones cut the corners)
  el.style.setProperty('--inset', mask ? '78px' : '34px');
  el.style.setProperty('--fs', mask ? '150px' : '178px');
  el.style.setProperty('--sfs', mask ? '30px' : '36px');
  el.style.setProperty('--gap', mask ? '14px' : '18px');
  if (q.get('round') === '1') el.classList.add('round');
</script></body></html>
